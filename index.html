const KEY='mimenu:data',VERSION=1;

const emptyData=()=>({version:VERSION,categories:[...DEF_CATS],ingredients:[],meals:[],plans:{},lists:[]});
function validate(d){
  if(d&&d.app==='mimenu'&&d.data)d=d.data;
  if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('El contenido no es una copia de Mi Menú.');
  if(!['categories','ingredients','meals','plans','lists'].every(k=>Object.prototype.hasOwnProperty.call(d,k)))throw new Error('Faltan datos de una copia completa de Mi Menú.');
  if((d.version||0)>VERSION)throw new Error('La copia es de una versión más nueva.');
  for(const k of ['categories','ingredients','meals','lists'])if(d[k]!=null&&!Array.isArray(d[k]))throw new Error('Campo «'+k+'» no válido.');
  const obj=v=>v&&typeof v==='object'&&!Array.isArray(v);
  if(d.plans!=null&&!obj(d.plans))throw new Error('La planificación no es válida.');
  if((d.categories||[]).some(c=>typeof c!=='string'||!c.trim()))throw new Error('Hay categorías no válidas.');

  idsOk(d.ingredients||[],'ingredientes');idsOk(d.meals||[],'comidas');idsOk(d.lists||[],'listas');
  if((d.ingredients||[]).some(i=>typeof i.name!=='string'||!i.name.trim()||typeof i.cat!=='string'||(i.unit!=null&&!UNITS.includes(i.unit))))throw new Error('Hay ingredientes no válidos.');

  if(Object.entries(d.plans||{}).some(([week,p])=>!/^\d{4}-\d{2}-\d{2}$/.test(week)||!obj(p)||Object.values(p).some(a=>!Array.isArray(a)||a.some(id=>typeof id!=='string'))))throw new Error('La planificación contiene datos no válidos.');
  if((d.lists||[]).some(l=>typeof l.week!=='string'||!Number.isFinite(l.created)||!Array.isArray(l.items)||l.items.some(i=>!obj(i)||typeof i.id!=='string'||typeof i.name!=='string'||typeof i.cat!=='string')))throw new Error('Hay listas de compra no válidas.');
  const ings=(d.ingredients||[]).filter(i=>i&&i.id&&i.name),ids=new Set(ings.map(i=>i.id));
  const meals=(d.meals||[]).filter(m=>m&&m.id&&m.name).map(m=>({...m,items:(m.items||[]).filter(it=>ids.has(it.ingId))}));

const Store={
  load(){let raw;try{raw=localStorage.getItem(KEY)}catch(e){storageState.issue='El navegador no permite guardar datos. Exporta una copia antes de cerrar.';return null}
    if(!raw)return null;
    try{return validate(JSON.parse(raw))}catch(e){
      try{localStorage.setItem(KEY+':corrupt:'+Date.now(),raw)}catch(_){}
      try{const prev=localStorage.getItem(KEY+':previous');if(prev){const recovered=validate(JSON.parse(prev));storageState.issue='Se recuperó la versión guardada anterior. Revisa tus datos y exporta una copia.';return recovered}}catch(_){}
      storageState.blocked=true;storageState.issue='Los datos guardados no se pueden leer. Se han protegido frente a sobrescrituras. Restaura una copia desde Ajustes.';return null;
    }
  },
  save(d){if(storageState.blocked)return false;
    try{const raw=JSON.stringify(d),old=localStorage.getItem(KEY);if(old===raw)return true;

      localStorage.setItem(KEY,raw);return true

function withCatalog(data){
  const d=JSON.parse(JSON.stringify(data));
  if(d.catalogVersion>=1)return d;
  for(const g of CATALOGO_INICIAL){
    const found=d.ingredients.find(i=>dkey(CATALOG_ALIASES[dkey(i.name)]||i.name)===dkey(g.name));
    if(found){found.name=g.name;continue}
    d.ingredients.push({...g,id:d.ingredients.some(i=>i.id===g.id)?uid():g.id});
  }
  for(const cat of [...new Set(CATALOGO_INICIAL.map(i=>i.cat))])if(!d.categories.includes(cat))d.categories.push(cat);
  d.catalogVersion=1;
  return d;
}
const lastExport=()=>{try{return localStorage.getItem(KEY+':lastExport')}catch(e){return null}};
function downloadBackup(d){
  const blob=new Blob([Store.backup(d)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='mimenu-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  const date=new Date().toISOString();try{localStorage.setItem(KEY+':lastExport',date)}catch(e){}return date;
}
function useGuardedClose(value,onClose,ask){
  const initial=useRef(JSON.stringify(value));const dirty=initial.current!==JSON.stringify(value);
  useEffect(()=>{if(!dirty)return;const warn=e=>{e.preventDefault();e.returnValue=''};window.addEventListener('beforeunload',warn);return()=>window.removeEventListener('beforeunload',warn)},[dirty]);

function Sheet({title,onClose,children,footer}){

function Ingredientes({d,up,ask,flash,openSettings}){
  const[q,setQ]=useState(''),[cat,setCat]=useState(''),[edit,setEdit]=useState(null),[imp,setImp]=useState(false);
  const uses=useMemo(()=>{const c={};d.meals.forEach(m=>m.items.forEach(i=>c[i.ingId]=(c[i.ingId]||0)+1));return c},[d.meals]);
  const list=d.ingredients.filter(i=>(!cat||i.cat===cat)&&norm(i.name).includes(norm(q))).sort((a,b)=>a.name.localeCompare(b.name,'es'));

    <div className="mt-2 space-y-2"><${Search} value=${q} onChange=${setQ} placeholder="Buscar ingrediente"/><${Chips} items=${[['','Todas'],...d.categories.map(c=>[c,c])]} value=${cat} onChange=${setCat}/></div><//>
  <main className="px-4 pb-32">${d.ingredients.length===0?html`<${Empty} icon="🥕" title="Tu catálogo está vacío" text="Pega la lista de tus notas del iPhone o añade productos uno a uno."><button className=${PRI} onClick=${()=>setImp(true)}>Pegar mi lista</button><button className=${SEC} onClick=${()=>setEdit({})}>Añadir ingrediente</button><//>`

      <span className="product-symbol"><${Icon} name=${categoryIcon(i.cat)} size=${19}/></span><div className="flex-1 min-w-0"><p className=${cx('font-medium truncate',i.active===false&&'text-mute line-through')}>${i.name}</p>${sub&&html`<p className="text-xs text-mute truncate">${sub}</p>`}</div><span className="text-mute">›</span></button>`})}</div></section>`)}</div>`}</main>
  ${edit&&html`<${IngForm} ing=${edit} d=${d} up=${up} ask=${ask} flash=${flash} uses=${uses[edit.id]||0} onClose=${()=>setEdit(null)}/>`}

}
function IngForm({ing,d,up,ask,flash,uses,onClose}){
  const isNew=!ing.id;
  const[f,setF]=useState({name:'',cat:'Otros',unit:'ud',qty:'',active:true,...ing}),[newCat,setNewCat]=useState('');
  const closeEditor=useGuardedClose({f,newCat},onClose,ask);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const dup=f.name.trim()?d.ingredients.find(x=>x.id!==f.id&&dkey(x.name)===dkey(f.name)):null;
  const save=async()=>{const name=properName(f.name);if(!name)return;let cat=f.cat;if(cat==='__new'){cat=newCat.trim();if(!cat)return}
    if(dup&&!(await ask('Ya existe «'+dup.name+'». ¿Guardar igualmente como otro producto?')))return;
    up(n=>{if(!n.categories.includes(cat))n.categories.push(cat);const v={...f,name,cat,qty:num(f.qty)??''};
      if(isNew)n.ingredients.push({...v,id:uid()});else n.ingredients=n.ingredients.map(x=>x.id===v.id?v:x)});
    flash(isNew?'Ingrediente añadido':'Cambios guardados');onClose()};
  const del=async()=>{if(uses){if(await ask('Se usa en '+uses+(uses>1?' comidas':' comida')+'. Para no romper tus recetas se desactivará en lugar de eliminarse.')){up(n=>{n.ingredients.find(x=>x.id===f.id).active=false});onClose()}return}
    if(await ask('¿Eliminar «'+f.name+'»?')){up(n=>{n.ingredients=n.ingredients.filter(x=>x.id!==f.id)});onClose()}};
  return html`<${Sheet} title=${isNew?'Nuevo ingrediente':'Editar ingrediente'} onClose=${closeEditor} footer=${html`<div className="flex gap-2">${!isNew&&html`<button className=${GHOST+' text-red-500'} onClick=${del}>Eliminar</button>`}<button className=${PRI+' flex-1'} disabled=${!f.name.trim()} onClick=${save}>Guardar</button></div>`}>
  <div className="space-y-4">

    <div className="grid grid-cols-2 gap-3"><${Field} label="Cantidad habitual"><input className=${IN} inputMode="decimal" value=${f.qty} onChange=${e=>set('qty',e.target.value)} placeholder="Opcional"/><//>
      <${Field} label="Unidad"><select className=${IN} value=${f.unit} onChange=${e=>set('unit',e.target.value)}>${UNITS.map(u=>html`<option key=${u}>${u}</option>`)}</select><//></div>
    ${!isNew&&html`<label className="flex items-center justify-between py-1"><span>Activo (aparece al crear comidas)</span><input type="checkbox" className="w-6 h-6 accent-[var(--brand)]" checked=${f.active!==false} onChange=${e=>set('active',e.target.checked)}/></label>`}
  </div><//>`;
}
function ImportSheet({d,up,flash,onClose}){
  const[text,setText]=useState(''),[rows,setRows]=useState(null);
  const status=(r,i,rs)=>d.ingredients.some(x=>dkey(x.name)===dkey(r.name))?'existe':rs.slice(0,i).some(x=>dkey(x.name)===dkey(r.name))?'repetido':'nuevo';
  const analyze=()=>{const r=[];text.split(/\n|;/).forEach(line=>{let l=line.replace(/^[\s\-•*·☐▢✓]+/,'').trim(),qty='',m;if(!l)return;
      if(m=l.match(/^(.*?)\s+[x×]\s*(\d+(?:[.,]\d+)?)$/i)){l=m[1];qty=m[2]}else if(m=l.match(/^(\d+(?:[.,]\d+)?)\s*[x×]\s+(.+)$/i)){l=m[2];qty=m[1]}
      const name=properName(l);if(name)r.push({id:uid(),raw:line.trim(),name,cat:guessCat(name),qty})});
    setRows(r.map((x,i)=>({...x,on:status(x,i,r)==='nuevo'})))};
  const setR=(id,k,v)=>setRows(rs=>rs.map(x=>x.id===id?{...x,[k]:v}:x));
  const chosen=(rows||[]).filter(r=>r.on&&r.name.trim());
  const commit=()=>{up(n=>chosen.forEach(r=>{if(!n.categories.includes(r.cat))n.categories.push(r.cat);n.ingredients.push({id:uid(),name:properName(r.name),cat:r.cat,unit:'ud',qty:num(r.qty)??'',active:true})}));flash(chosen.length+' ingredientes importados');onClose()};
  const badge={nuevo:['Nuevo','bg-soft text-brand'],existe:['Ya existe','bg-amber-100 text-amber-800'],repetido:['Repetido','bg-amber-100 text-amber-800']};
  return html`<${Sheet} title="Importar ingredientes" onClose=${onClose} footer=${rows?html`<div className="flex gap-2"><button className=${GHOST} onClick=${()=>setRows(null)}>Volver</button><button className=${PRI+' flex-1'} disabled=${!chosen.length} onClick=${commit}>Importar ${chosen.length}</button></div>`:html`<button className=${PRI+' w-full'} disabled=${!text.trim()} onClick=${analyze}>Revisar</button>`}>

function MealEditor({meal,d,up,ask,flash,onClose}){

/* ---------- Semanal ---------- */
function Semanal({d,up,ask,flash,week,setWeek}){
  const[slot,setSlot]=useState(null);
  const plan=d.plans[week]||{},mealBy=Object.fromEntries(d.meals.map(m=>[m.id,m])),today=ymd(new Date());
  const dup=async()=>{const src=d.plans[addDays(week,-7)];if(!planCount(src))return flash('La semana anterior está vacía');
    if(planCount(plan)&&!(await ask('¿Sustituir esta semana por el menú de la semana anterior?')))return;up(n=>{n.plans[week]=JSON.parse(JSON.stringify(src))});flash('Semana duplicada')};
  const clear=async()=>{if(!planCount(plan))return flash('La semana ya está vacía');if(await ask('¿Vaciar la planificación de esta semana?'))up(n=>{delete n.plans[week]})};
  return html`<${Top} title="Semanal"><${WeekNav} week=${week} setWeek=${setWeek}/>
    <div className="flex gap-2 mt-2"><button className=${GHOST+' flex-1 py-2 text-sm'} onClick=${dup}>Copiar semana anterior</button><button className=${GHOST+' py-2 text-sm'} onClick=${clear}>Vaciar</button></div><//>
  <main className="week-grid px-4 pb-32">${DAYS.map((dn,i)=>{const date=parseD(addDays(week,i)),done=['comida','cena'].every(s=>(plan[i+'-'+s]||[]).length);

      <div className="flex items-center justify-between px-1"><p className="font-bold">${dn} <span className="text-mute font-normal">${date.getDate()} ${MES[date.getMonth()]}</span></p>${done&&html`<span className="text-xs font-semibold text-brand bg-soft rounded-full px-2 py-0.5">✓ Completo</span>`}</div>
      ${['comida','cena'].map(s=>{const ids=plan[i+'-'+s]||[];return html`<button key=${s} onClick=${()=>setSlot({i,s})} className="w-full flex items-start gap-3 text-left px-1 py-2 active:opacity-60">
        <span className="w-14 shrink-0 text-sm text-mute pt-1">${s==='comida'?'Comida':'Cena'}</span>
        <span className="flex-1 flex flex-wrap gap-1.5">${ids.length?ids.map(id=>html`<span key=${id} className="bg-soft text-brand rounded-lg px-2 py-1 text-sm font-medium">${mealBy[id]?.name||'—'}</span>`):html`<span className="text-mute text-sm pt-1">Sin planificar</span>`}</span>
        <span className="text-brand text-lg leading-7">＋</span></button>`})}</div>`})}</main>
  ${slot&&html`<${SlotPicker} d=${d} up=${up} flash=${flash} week=${week} slot=${slot} onClose=${()=>setSlot(null)}/>`}`;

function QtyEdit({it,onSave}){const[q,setQ]=useState(it.qty??''),[u,setU]=useState(it.unit||'ud');

function Compra({d,up,ask,flash,week,setWeek,showText}){
  const[sel,setSel]=useState(null),[hist,setHist]=useState(false),[nn,setNn]=useState(''),[editId,setEditId]=useState(null);
  const wl=d.lists.filter(l=>l.week===week).sort((a,b)=>b.created-a.created),list=wl.find(l=>l.id===sel)||wl[0];
  const upL=f=>up(n=>{f(n.lists.find(l=>l.id===list.id))});
  const dirty=list&&(list.edited||list.items.some(i=>i.checked||i.manual));
  const gen=async()=>{const items=buildItems(d,week);if(!items.length)return flash('No hay platos con ingredientes en esta semana');
    if(dirty&&!(await ask('La lista actual tiene productos marcados o cambios manuales. Se creará una lista nueva y la actual quedará en el historial.')))return;
    const L={id:uid(),week,created:Date.now(),items,edited:false};up(n=>{if(list&&!dirty)n.lists=n.lists.filter(l=>l.id!==list.id);n.lists.push(L)});setSel(L.id);flash('Lista generada')};
  const blank=()=>{const L={id:uid(),week,created:Date.now(),items:[],edited:true};up(n=>{n.lists.push(L)});setSel(L.id)};
  const remove=id=>{const snapshot={...list.items.find(i=>i.id===id)},index=list.items.findIndex(i=>i.id===id),listId=list.id;
    upL(l=>{l.items=l.items.filter(x=>x.id!==id);l.edited=true});
    flash('Producto eliminado',()=>up(n=>{const l=n.lists.find(x=>x.id===listId);if(l&&!l.items.some(x=>x.id===id))l.items.splice(Math.min(index,l.items.length),0,snapshot)}));
  };
  const toggle=id=>upL(l=>{const x=l.items.find(x=>x.id===id);x.checked=!x.checked});
  const addManual=()=>{const name=properName(nn);if(!name)return;const g=d.ingredients.find(i=>dkey(i.name)===dkey(name));
    upL(l=>{l.items.push({id:uid(),ingId:g?g.id:null,name:g?g.name:name,cat:g?g.cat:guessCat(name),qty:g?num(g.qty):null,unit:g?g.unit:'ud',checked:false,manual:true});l.edited=true});setNn('')};
  let groups=[];if(list){const cats=[...d.categories];list.items.forEach(i=>{if(!cats.includes(i.cat))cats.push(i.cat)});
    groups=cats.map(c=>[c,list.items.filter(i=>i.cat===c).sort((a,b)=>a.checked-b.checked||a.name.localeCompare(b.name,'es'))]).filter(g=>g[1].length);
    groups.sort((a,b)=>a[1].every(i=>i.checked)-b[1].every(i=>i.checked))}
  const total=list?list.items.length:0,done=list?list.items.filter(i=>i.checked).length:0;
  const toText=()=>'🛒 Mi compra ('+weekLabel(week)+')\n'+groups.map(([c,its])=>'\n'+c+'\n'+its.map(i=>(i.checked?'✓ ':'☐ ')+i.name+(i.qty!=null?' '+fmtQty(i.qty,i.unit):'')).join('\n')).join('\n');
  const copy=async()=>{const t=toText();if(await copyText(t))flash('Lista copiada');else showText(t)};
  const share=async()=>{const t=toText();if(navigator.share){try{await navigator.share({title:'Mi compra',text:t});return}catch(e){if(e.name==='AbortError')return}}copy()};
  const reset=async()=>{if(done&&await ask('¿Desmarcar todos los productos?'))upL(l=>l.items.forEach(i=>i.checked=false))};
  return html`<${Top} title="Mi compra" right=${d.lists.length>0&&html`<${Pill} onClick=${()=>setHist(true)}>Historial<//>`}><${WeekNav} week=${week} setWeek=${w=>{setWeek(w);setSel(null)}}/><//>
  <main className="px-4 pb-32">
    <button className=${PRI+' w-full text-lg py-4 mt-1 shadow-sm'} onClick=${gen}>${list?'↻ Regenerar lista':'🛒 Generar lista de la compra'}</button>
    ${!list?html`<${Empty} icon="🧺" title="Sin lista para esta semana" text="Planifica tus comidas en Semanal y genera la lista con un toque."><button className=${SEC} onClick=${blank}>Empezar lista vacía</button><//>`
    :html`<div className="mt-4">
      <div className="flex items-center justify-between text-sm mb-1"><span className="font-semibold">${done===total&&total?'¡Compra completa!':(total-done)+' pendientes'}</span><span className="text-mute">${done} de ${total}</span></div>
      <div className="h-2 rounded-full bg-line overflow-hidden"><div className="h-full bg-brand transition-all" style=${{width:(total?done/total*100:0)+'%'}}></div></div>

      ${groups.map(([c,its])=>html`<section key=${c} className="mt-5"><h3 className="text-sm font-semibold text-mute mb-1.5 px-1">${c}</h3><div className=${CARD+' divide-y divide-line overflow-hidden'}>${its.map(it=>html`<div key=${it.id} className="flex items-center gap-3 px-3 py-2.5">
        <button aria-label="Marcar" onClick=${()=>toggle(it.id)} className=${cx('w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 transition',it.checked?'bg-brand border-brand text-white':'border-line')}>${it.checked?'✓':''}</button>
        <button onClick=${()=>toggle(it.id)} className=${cx('flex-1 min-w-0 text-left truncate py-1',it.checked&&'line-through text-mute')}>${it.name}</button>
        ${editId===it.id?html`<${QtyEdit} it=${it} onSave=${(q,u)=>{upL(l=>{const x=l.items.find(x=>x.id===it.id);x.qty=q;x.unit=u;l.edited=true});setEditId(null)}}/>`
          :html`<button onClick=${()=>setEditId(it.id)} className=${cx('text-sm px-2 py-1 rounded-lg bg-bg shrink-0',it.qty==null&&'text-mute')}>${it.qty!=null?fmtQty(it.qty,it.unit):'cant.'}</button>`}
        <button aria-label="Eliminar" onClick=${()=>remove(it.id)} className="text-mute w-6 shrink-0">✕</button></div>`)}</div></section>`)}
      <div className="flex gap-2 mt-5"><input className=${IN} value=${nn} onChange=${e=>setNn(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&addManual()} placeholder="Añadir producto a la lista"/><button className=${SEC} disabled=${!nn.trim()} onClick=${addManual}>Añadir</button></div>
      <p className="text-xs text-mute mt-3 text-center">Generada el ${new Date(list.created).toLocaleDateString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}. Cambiar recetas no modifica esta lista.</p></div>`}
  </main>
  ${hist&&html`<${Sheet} title="Listas guardadas" onClose=${()=>setHist(false)}><div className="space-y-2">${[...d.lists].sort((a,b)=>b.created-a.created).map(l=>html`<div key=${l.id} className=${cx(CARD,'flex items-center',list&&l.id===list.id&&'ring-2 ring-brand')}>
    <button className="flex-1 text-left p-3" onClick=${()=>{setWeek(l.week);setSel(l.id);setHist(false)}}><p className="font-medium">Semana ${weekLabel(l.week)}</p><p className="text-xs text-mute">${new Date(l.created).toLocaleDateString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}, ${l.items.filter(i=>i.checked).length} de ${l.items.length} comprados</p></button>
    <button aria-label="Eliminar lista" className="px-4 text-mute" onClick=${async()=>{if(await ask('¿Eliminar esta lista?'))up(n=>{n.lists=n.lists.filter(x=>x.id!==l.id)})}}>✕</button></div>`)}</div><//>`}`;
}

/* ---------- Ajustes / copia de seguridad ---------- */
function Settings({d,up,ask,flash,onClose,showText}){
  const[txt,setTxt]=useState(''),[cat,setCat]=useState(''),[exported,setExported]=useState(lastExport);
  const used=new Set(d.ingredients.map(i=>i.cat));
  const exp=()=>{try{setExported(downloadBackup(d));flash('Copia preparada para descargar. Comprueba que se ha guardado en Archivos o Descargas.')}catch(e){flash('No se pudo descargar. Usa Copiar copia.')}};
  const copyBackup=async()=>{const t=Store.backup(d);if(await copyText(t))flash('Copia copiada. Guárdala fuera de esta aplicación.');else showText(t)};
  const imp=async t=>{try{const v=validate(JSON.parse(t));
      if(await ask('Copia con '+v.ingredients.length+' ingredientes, '+v.meals.length+' comidas y '+v.lists.length+' listas. ¿Sustituir todos tus datos actuales?')){storageState.blocked=false;storageState.issue='';v.catalogVersion=1;up(n=>{Object.keys(n).forEach(k=>delete n[k]);Object.assign(n,v)});flash('Datos restaurados');onClose()}}
    catch(e){flash(e instanceof SyntaxError?'El texto no es una copia válida':e.message)}};
  return html`<${Sheet} title="Ajustes" onClose=${onClose}><div className="space-y-6">
    <${ThemePicker}/><section><h3 className="font-semibold mb-1">Copia de seguridad</h3><p className="text-sm text-mute mb-3">Tus datos se guardan solo en este dispositivo. Exporta una copia de vez en cuando y guárdala en Notas o Archivos.</p>
      <button className=${PRI+' w-full'} onClick=${exp}>Descargar copia de seguridad</button>
      <button className=${SEC+' w-full mt-2'} onClick=${copyBackup}>Copiar copia como texto</button>
      <p className="text-xs text-mute mt-2">${exported?'Última exportación solicitada: '+new Date(exported).toLocaleString('es-ES'):'Todavía no has exportado una copia.'} Comprueba siempre que el archivo se ha guardado. La copia interna anterior no sustituye una copia externa.</p>
      <textarea className=${IN+' h-24 mt-3 text-sm'} value=${txt} onChange=${e=>setTxt(e.target.value)} placeholder="Pega aquí una copia para restaurarla"></textarea>
      <div className="flex gap-2 mt-2"><button className=${SEC+' flex-1'} disabled=${!txt.trim()} onClick=${()=>imp(txt)}>Restaurar texto</button>
        <label className=${GHOST+' flex-1 text-center cursor-pointer'}>Desde archivo<input type="file" accept=".json,application/json,text/plain" className="hidden" onChange=${e=>{const f=e.target.files[0];if(f)f.text().then(imp);e.target.value=''}}/></label></div></section>
    <section><h3 className="font-semibold mb-2">Categorías</h3><div className="flex flex-wrap gap-2">${d.categories.map(c=>html`<span key=${c} className="bg-bg border border-line rounded-full pl-3 pr-1 py-1 text-sm flex items-center gap-1">${c}${!used.has(c)&&c!=='Otros'&&html`<button aria-label="Quitar" className="w-6 text-mute" onClick=${()=>up(n=>{n.categories=n.categories.filter(x=>x!==c)})}>✕</button>`}${(used.has(c)||c==='Otros')&&html`<span className="w-2"></span>`}</span>`)}</div>
      <div className="flex gap-2 mt-3"><input className=${IN} value=${cat} onChange=${e=>setCat(e.target.value)} placeholder="Nueva categoría"/><button className=${SEC} disabled=${!cat.trim()||d.categories.includes(cat.trim())} onClick=${()=>{up(n=>{n.categories.push(cat.trim())});setCat('')}}>Añadir</button></div></section>
  </div><//>`;
}

/* ---------- App ---------- */
const TABS=[['inicio','home','Inicio'],['semanal','calendar','Semanal'],['comidas','book','Comidas'],['ingredientes','leaf','Ingredientes'],['compra','bag','Mi compra']];
function App(){
  const[d,setD]=useState(()=>{const loaded=Store.load();if(storageState.blocked)return emptyData();return withCatalog(loaded||emptyData())});
  const[saveError,setSaveError]=useState(''),[storageNotice,setStorageNotice]=useState(()=>storageState.issue);
  const[tab,setTab]=useState(()=>{try{return (TABS.some(t=>t[0]===localStorage.getItem(KEY+':tab'))?localStorage.getItem(KEY+':tab'):'inicio')}catch(e){return'inicio'}});
  const[week,setWeek]=useState(()=>ymd(monday(new Date())));
  const[dlg,setDlg]=useState(null),[toast,setToast]=useState(null),[settings,setSettings]=useState(false),[text,setText]=useState(null);
  const up=f=>setD(p=>{const n=JSON.parse(JSON.stringify(p));f(n);return n});
  const ask=msg=>new Promise(r=>setDlg({msg,r}));
  const flash=(t,undo=null)=>{setToast({message:t,undo});clearTimeout(window.__t);window.__t=setTimeout(()=>setToast(null),undo?12000:3500)};
  useEffect(()=>{setSaveError(Store.save(d)?'':(storageState.issue||'No se han guardado los últimos cambios. Exporta una copia antes de cerrar.'));setStorageNotice(storageState.issue)},[d]);
  useEffect(()=>{try{localStorage.setItem(KEY+':tab',tab)}catch(e){}window.scrollTo(0,0)},[tab]);
  useEffect(()=>{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}},[]);
  useEffect(()=>{if(!saveError)return;const warn=e=>{e.preventDefault();e.returnValue=''};window.addEventListener('beforeunload',warn);return()=>window.removeEventListener('beforeunload',warn)},[saveError]);
  const p={d,up,ask,flash,week,setWeek,showText:setText};
  const close=v=>{dlg.r(v);setDlg(null)};
  return html`<div className="app-shell">
    ${(saveError||storageNotice)&&html`<div role="alert" className="bg-amber-100 text-amber-800 p-4 text-sm border-b border-line"><p>${saveError||storageNotice}</p><div className="flex gap-2 mt-2"><button className="underline font-semibold" onClick=${()=>setSettings(true)}>Ajustes y copia</button><button className="underline font-semibold" onClick=${()=>{if(Store.save(d)){setSaveError('');setStorageNotice('')}else setSaveError(storageState.issue||'Sigue sin poder guardarse. Descarga una copia.')}}>Reintentar guardado</button></div></div>`}
    ${tab==='inicio'&&html`<${Inicio} d=${d} setTab=${setTab} setWeek=${setWeek} openSettings=${()=>setSettings(true)}/>`}
    ${tab==='ingredientes'&&html`<${Ingredientes} ...${p} openSettings=${()=>setSettings(true)}/>`}
    ${tab==='comidas'&&html`<${Comidas} ...${p}/>`}
    ${tab==='semanal'&&html`<${Semanal} ...${p}/>`}
    ${tab==='compra'&&html`<${Compra} ...${p}/>`}
    <nav className="app-dock" aria-label="Navegación principal"><div className="dock-inner">${TABS.map(([k,icon,label])=>html`<button key=${k} aria-label=${label} aria-current=${tab===k?'page':undefined} onClick=${()=>setTab(k)} className=${cx('dock-item',tab===k&&'is-active')}><${Icon} name=${icon} size=${22}/><span>${label}</span></button>`)}</div></nav>
    ${settings&&html`<${Settings} ...${p} onClose=${()=>setSettings(false)}/>`}
    ${text!=null&&html`<${Sheet} title="Copia manual" onClose=${()=>setText(null)}><p className="text-sm text-mute mb-2">Este navegador no permite copiar automáticamente. Mantén pulsado el texto, elige Seleccionar todo y Copiar.</p><textarea readOnly className=${IN+' h-64 text-sm'} value=${text}></textarea><//>`}
    ${toast&&html`<div className="fixed inset-x-0 z-50 flex justify-center px-4 fade" style=${{bottom:'calc(84px + env(safe-area-inset-bottom,0px))'}}><div role="status" className="bg-ink text-bg text-sm rounded-2xl px-4 py-3 shadow-lg flex items-center gap-3"><span>${toast.message}</span>${toast.undo&&html`<button className="font-bold underline p-1" onClick=${()=>{toast.undo();setToast(null)}}>Deshacer</button>`}</div></div>`}
    ${dlg&&html`<div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/40 fade"><div className=${CARD+' p-5 w-full max-w-sm'}><p className="mb-5">${dlg.msg}</p><div className="flex gap-2"><button className=${GHOST+' flex-1'} onClick=${()=>close(false)}>Cancelar</button><button className=${PRI+' flex-1'} onClick=${()=>close(true)}>Aceptar</button></div></div></div>`}
  </div>`;
}
try{const theme=localStorage.getItem(KEY+':theme');if(theme==='light'||theme==='dark')document.documentElement.dataset.theme=theme}catch(e){}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
